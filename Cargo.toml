[package]
name = "KmoeFix"
version = "1.0.0"
edition = "2021"
description = "Repair shuffled comic EPUB page order: rename pages by real page number, reorder spine, move site card pages to the end, strip dirty attributes, repack per EPUB spec"
license = "GPL-3.0-or-later"

[[bin]]
name = "KmoeFix"
path = "src/main.rs"

[lib]
# rustc 要求 crate 名为 snake_case，故只有产出物与包名用 KmoeFix
name = "kmoefix"
path = "src/lib.rs"

[dependencies]
zip = { version = "2.2", default-features = false, features = ["deflate"] }
regex = "1"
eframe = "0.31"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
crc32fast = "1"
# 侧放页回正（--rotate-cover）用：只取 jpeg/png 两个编解码器。
# image 已因 eframe 在 Cargo.lock 里，不引入新的第三方 crate。
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[build-dependencies]
# 图标嵌入 PE 资源：生成 .rc 并调 Windows SDK 的 rc.exe（不引第三方资源编译器）
tauri-winres = "0.3"

[dev-dependencies]
