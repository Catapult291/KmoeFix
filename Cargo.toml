[package]
name = "kmoefix"
version = "1.0.0"
edition = "2021"
description = "Fix Kmoe-exported comic EPUBs: reorder spine by page number, rename html/image assets, strip dirty tags, repack per EPUB spec (Rust port of KmoeFix core.py)"
license = "MIT"

[[bin]]
name = "kmoefix"
path = "src/main.rs"

[lib]
name = "kmoefix"
path = "src/lib.rs"

[dependencies]
zip = { version = "2.2", default-features = false, features = ["deflate"] }
regex = "1"
eframe = "0.31"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
crc32fast = "1"
# 侧放页回正（--rotate-cover）用：只取 jpeg/png 两个编解码器。
# image 已因 eframe 在 Cargo.lock 里，不引入新的第三方 crate。
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
