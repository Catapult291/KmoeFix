[project]
name = "KmoeFix"
version = "1.0.0"
description = "修复 Kmoe 导出 EPUB 乱序与脏标签的一键工具"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "KmoeFix Contributors"}]
dependencies = ["tkinterdnd2>=0.1.3"]

[project.scripts]
kmoefix = "src.kmoe_fix:run_gui"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py310"]
