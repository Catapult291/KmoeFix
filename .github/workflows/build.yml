name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller==6.12
      - run: python -m PyInstaller KmoeFix.spec --noconfirm --clean
      - uses: actions/upload-artifact@v4
        with:
          name: KmoeFix-exe
          path: dist/KmoeFix.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KmoeFix-exe
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/KmoeFix.exe
